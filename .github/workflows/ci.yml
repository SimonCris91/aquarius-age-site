name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Static site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check dist/app.js
      - name: Verify site entry points
        run: |
          test -f index.html
          test -f styles.css
          test -f dist/index.html
          test -f dist/styles.css
          test -d dist/images
